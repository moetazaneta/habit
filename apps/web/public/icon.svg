<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- A Day gauge, two thirds full, in the palette's blue. -->
  <defs>
    <clipPath id="square">
      <rect x="4" y="4" width="56" height="56" rx="18" />
    </clipPath>
  </defs>
  <g clip-path="url(#square)">
    <rect x="4" y="4" width="56" height="56" fill="#6f9bd1" fill-opacity="0.16" />
    <rect x="4" y="25" width="56" height="35" fill="#6f9bd1" />
  </g>
  <rect x="5.5" y="5.5" width="53" height="53" rx="16.5" fill="none" stroke="#6f9bd1" stroke-opacity="0.5" stroke-width="3" />
</svg>
