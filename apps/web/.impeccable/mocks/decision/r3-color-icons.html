<title>Habit / Round 3 B, icons in the habit colour</title>
<style>
/* Round 3 B: quiet standard on pure black; each duotone icon takes its habit's muted colour.
   Columns: 5 squares x 30px + 4 gaps x 6px = 174px, right edge at x=370 (20px margin). */
*{box-sizing:border-box}
html{background:#000}
body{margin:0;width:390px;height:844px;overflow:hidden;position:relative;background:#000;color:#e5e5ea;
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif;-webkit-font-smoothing:antialiased}
/* status bar, 47px */
.sb{height:47px;position:relative}
.sb .time{position:absolute;left:38px;top:15px;font:600 15px/20px system-ui,-apple-system;letter-spacing:-.2px}
.sb svg{position:absolute;right:26px;top:19px}
/* day header directly under the status bar, columns sit exactly over the squares; no today band */
.hd{display:grid;grid-template-columns:repeat(5,30px);gap:6px;margin-left:196px;height:46px;padding-top:6px;text-align:center}
.hd div{display:flex;flex-direction:column;align-items:center;gap:1px;color:#8e8e93}
.hd small{font:500 12px/15px system-ui,-apple-system}
.hd span{font:400 16px/20px system-ui,-apple-system;letter-spacing:-.3px;font-variant-numeric:tabular-nums}
.hd .now{color:#f2f2f7}
.hd .now small,.hd .now span{font-weight:700}
/* rows: duotone icon in the habit colour (no tile; the 0.2 layer becomes its soft tint) + name, five squares */
.r{height:54px;display:flex;align-items:center;padding:0 20px}
.r>svg{width:22px;height:22px;flex:none;color:var(--c);fill:currentColor}
.r b{flex:1;margin-left:12px;font:600 17px/22px system-ui,-apple-system;letter-spacing:-.41px;white-space:nowrap;color:#b9b9be}
.d{display:grid;grid-template-columns:repeat(5,30px);gap:6px;flex:none}
/* square = gauge. Frame 1.5px in the habit colour at 35%; fill rises from the bottom to --p; full = solid.
   Empty = frame only, in #2c2c2e, no fill. Superellipse corners, plain radius as the fallback. */
.d i{--p:100%;width:30px;height:30px;border-radius:10px;corner-shape:superellipse(2);
  box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--c) 35%,transparent);
  background:linear-gradient(to top,var(--c) var(--p),transparent 0)}
.d .e{background:none;box-shadow:inset 0 0 0 1.5px #2c2c2e}
/* signature, frozen frame: today's Spanish square mid-fill, 70%, spring overshoot to 1.04 */
.d .sig{transform:scale(1.04)}
/* new habit = ghost row: a habit that does not exist yet. Dashed icon square, dashed empty frames */
.r.new .gi{width:22px;height:22px;flex:none;display:grid;place-items:center;border:1px dashed #3a3a3c;
  border-radius:7px;corner-shape:superellipse(2)}
.r.new .gi svg{width:12px;height:12px;fill:#636366}
.r.new b{color:#636366}
.r.new .d i{background:none;box-shadow:none;border:1px dashed #2c2c2e}
/* toast, above the home indicator */
.toast{position:absolute;left:50%;bottom:44px;transform:translateX(-50%);height:46px;
  border-radius:999px;corner-shape:superellipse(2);
  background:#1c1c1e;display:flex;align-items:center;gap:20px;padding:0 22px;white-space:nowrap}
.toast span{font:500 15px/20px system-ui,-apple-system;letter-spacing:-.24px;color:#e5e5ea}
.toast a{font:600 15px/20px system-ui,-apple-system;letter-spacing:-.24px;color:#e5e5ea}
.home{position:absolute;left:128px;bottom:8px;width:134px;height:5px;border-radius:3px;background:#e5e5ea}
</style>
